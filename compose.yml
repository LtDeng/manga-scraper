version: "3.9"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Europe/London
      - TZ=Europe/London
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_RUNNERS_ENABLED=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/data;/home/node/.n8n-files
    volumes:
      - n8n_data:/home/node/.n8n
      - ./output:/data/shared
    depends_on:
      - manga_scraper
    restart: unless-stopped

  manga_scraper:
    image: docker.io/ltdeng/manga-scraper:latest
    container_name: manga-scraper-api
    ports:
      - "8000:8000"
    environment:
      - LIBRARY_ROOT=/app/library
      - HOST_LIBRARY_ROOT=${PWD}/library
      - KCC_DOCKER_IMAGE=ghcr.io/ciromattia/kcc:latest
      - KCC_EXECUTABLE=
      - KCC_FLAGS=--format EPUB --nokepub --manga-style
      # For Raspberry Pi / Jetson if needed:
      # - KCC_DOCKER_PLATFORM=linux/arm64
    volumes:
      - ./library:/app/library
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  n8n_data:
